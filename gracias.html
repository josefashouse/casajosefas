<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud Recibida | Casa Josefas</title>
    <style>
        :root {
            --primary: #2d5a27;
            --primary-hover: #1e3c1a;
            --bg-color: #fcfbf9;
            --card-bg: #ffffff;
            --text-main: #2b2b2b;
            --border-color: #e3ded8;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .thank-you-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px;
            max-width: 550px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
        }

        h1 {
            color: var(--primary);
            margin-top: 0;
            font-size: 28px;
        }

        p {
            font-size: 16px;
            color: #555;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            padding: 14px 28px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            display: inline-block;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }
    </style>
</head>
<body>

    <div class="thank-you-card">
        <h1>¡Reserva solicitada con éxito!</h1>
        <p>Hemos registrado tu solicitud correctamente. En las próximas <strong>48 horas</strong> te enviaremos un correo electrónico con las instrucciones necesarias y los datos de pago para acabar de formalizar tu reserva en Casa Josefas.</p>
        <a href="index.html" class="btn">Volver a la página principal</a>
    </div>

</body>
</html>
